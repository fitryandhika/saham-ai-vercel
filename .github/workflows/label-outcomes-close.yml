name: Retry due outcome labels

on:
  schedule:
    # GitHub Actions schedule uses UTC.
    # 09:00-13:40 UTC = 16:00-20:40 WIB on market days.
    - cron: "*/20 9-13 * * 1-5"
  workflow_dispatch: {}

jobs:
  label-close:
    runs-on: ubuntu-latest
    steps:
      - name: Label all due outcomes
        env:
          SAHAM_AI_URL: https://saham-ai-vercel-six.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::GitHub repository secret CRON_SECRET belum diset."
            echo "Tambahkan secret CRON_SECRET yang sama dengan Vercel Environment Variable CRON_SECRET."
            exit 1
          fi

          echo "Memanggil close-label worker di $(date -u)..."
          response=$(curl -sS --fail-with-body -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SAHAM_AI_URL/api/label-outcomes-close")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "HTTP status: $http_code"
          echo "Response: $body"