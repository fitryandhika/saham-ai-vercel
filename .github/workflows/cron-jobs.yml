name: Cron Stockgz

# LAPIS KE-2 dari 3. Revisi 10 September 2026.
#   Lapis 1: vercel.json — scan 17:00-17:59 WIB (resume=1) + labeling
#            21:00-21:59 WIB. Vercel Hobby hanya menjamin "dalam jam itu".
#   Lapis 2: file ini (GitHub Actions) + scan-backup.yml.
#   Lapis 3: cron-job.org — di luar GitHub, termasuk alarm email dari
#            /api/dashboard-data?type=scanhealth&strict=1.
#
# KONTRAK DENGAN api/scan.js (baca bagian "KONTRAK PENYIMPANAN" di sana):
#   - Scan yang MENULIS wajib membawa mode=scheduled (persist=true juga
#     diterima sebagai alias lama). Tanpa itu scan cuma baca.
#   - Penulisan ditolak sebelum 16:20 WIB dengan HTTP 409.
#   - Kalau penyimpanan gagal/tidak lengkap, scan membalas HTTP 5xx.
#     Workflow ini tidak lagi menebak dari isi JSON — status HTTP-nya
#     sudah jujur. Pemeriksaan isi di bawah hanya lapis pengaman kedua.
#   - resume=1 hanya memproses kode yang belum tersimpan hari ini.
#     Retry otomatis memakai resume=1 supaya tidak mengulang dari nol.
#
# RIWAYAT INSIDEN yang membentuk file ini:
#   20-21 Agu: batch insert gagal (kolom camelCase), API tetap 200.
#   07 Sep   : scheduler GitHub membuang jadwal scan (11 run seumur hidup
#              padahal dijadwalkan ~18 run/hari bursa).
#   09 Sep   : api/scan.js menuntut ?persist=true, pemanggil mengirim
#              ?mode=scheduled -> 397 emiten dihitung lalu dibuang,
#              respons tetap 200 success:true.
#
# CATATAN WAKTU: cron GitHub Actions memakai UTC. WIB = UTC+7.
#
# Dua ekspresi cron di SATU workflow tidak boleh jatuh tempo di menit DAN
# jam yang sama: GitHub cuma memicu satu run dan github.event.schedule
# cuma melaporkan satu string. Cek tabrakan setiap menambah jadwal.
# Hindari juga menit :00 untuk jadwal penting — awal jam adalah waktu
# paling padat di GitHub Actions dan paling sering dibuang.

on:
  schedule:
    # 09:25 UTC = 16:25 WIB — macro scan.
    - cron: "25 9 * * 1-5"
    # 09:30 UTC = 16:30 WIB — scan harian utama.
    - cron: "30 9 * * 1-5"
    # 02:15 UTC = 09:15 WIB — label tahap 1 (gap pembukaan).
    - cron: "15 2 * * 1-5"
    # Tiap 20 menit, 14:00-15:40 UTC = 21:00-22:40 WIB — label tahap 2.
    # Dimulai jam 21 karena candle harian Yahoo baru terbit 19-22 WIB;
    # berhenti sebelum 23:00 supaya run yang telat tidak menyeberang
    # tengah malam (getPendingCloseSnapshotsAcrossDates memakai
    # beforeDate = todayWIB).
    - cron: "*/20 14-15 * * 1-5"
    # 20:00 UTC Minggu = 03:00 WIB Senin — refresh universe.
    - cron: "0 20 * * 0"
  workflow_dispatch:
    inputs:
      target:
        description: "Endpoint yang dipanggil manual"
        required: true
        type: choice
        options:
          - scan
          - macro-scan
          - label-outcomes
          - label-outcomes-close
          - universe-refresh
      date:
        description: "Opsional, YYYY-MM-DD. Hanya untuk label-outcomes / label-outcomes-close. Scan tanggal lampau: pakai backfill-gap (lihat dashboard)."
        required: false
        type: string

env:
  BASE_URL: https://saham-ai-vercel-six.vercel.app

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Tentukan endpoint
        id: pick
        env:
          # Input dibaca lewat env, bukan disisipkan langsung ke skrip,
          # supaya isi kolom "date" tidak bisa dieksekusi sebagai perintah.
          SCHEDULE: ${{ github.event.schedule }}
          TARGET: ${{ inputs.target }}
          DATE_INPUT: ${{ inputs.date }}
        run: |
          SCAN_ENDPOINT="/api/scan?highConviction=false&mode=scheduled"

          case "$SCHEDULE" in
            "25 9 * * 1-5")       ENDPOINT="/api/macro-scan" ;;
            "30 9 * * 1-5")       ENDPOINT="$SCAN_ENDPOINT" ;;
            "15 2 * * 1-5")       ENDPOINT="/api/label-outcomes" ;;
            "*/20 14-15 * * 1-5") ENDPOINT="/api/label-outcomes-close" ;;
            "0 20 * * 0")         ENDPOINT="/api/universe-refresh" ;;
            "")
              # Manual (workflow_dispatch).
              case "$TARGET" in
                scan) ENDPOINT="$SCAN_ENDPOINT" ;;
                macro-scan|label-outcomes|label-outcomes-close|universe-refresh)
                  ENDPOINT="/api/$TARGET" ;;
                *)
                  echo "::error::Target manual tidak dikenal: '$TARGET'"
                  exit 1 ;;
              esac

              if [ -n "$DATE_INPUT" ]; then
                if ! [[ "$DATE_INPUT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
                  echo "::error::Format date harus YYYY-MM-DD, diterima: '$DATE_INPUT'"
                  exit 1
                fi
                case "$TARGET" in
                  label-outcomes|label-outcomes-close)
                    ENDPOINT="${ENDPOINT}?date=${DATE_INPUT}" ;;
                  *)
                    echo "::warning::Input 'date' diabaikan — $TARGET tidak menerimanya." ;;
                esac
              fi
              ;;
            *)
              echo "::error::String jadwal tidak dikenal: '$SCHEDULE'. Samakan daftar case dengan blok on.schedule."
              exit 1 ;;
          esac

          echo "endpoint=$ENDPOINT" >> "$GITHUB_OUTPUT"
          echo "Akan memanggil $ENDPOINT"

      - name: Panggil endpoint
        env:
          # Endpoint labeling menolak request tanpa header ini kalau
          # CRON_SECRET diset di Vercel. Aman walau kosong: header jadi
          # "Bearer " dan pengecekan dilewati kalau env Vercel juga kosong.
          # Isi lewat Settings -> Secrets and variables -> Actions.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ENDPOINT: ${{ steps.pick.outputs.endpoint }}
        run: |
          set -u
          BODY_FILE="$RUNNER_TEMP/body.json"

          # request URL -> 0 kalau 2xx, 1 kalau gagal. Isi respons di $BODY_FILE.
          # Retry hanya untuk kegagalan jaringan, 429, dan 5xx. 4xx (salah
          # jam, salah secret, salah parameter) tidak akan sembuh dengan
          # diulang, jadi langsung gagal supaya pesannya terbaca.
          request() {
            local url="$1" level="${2:-error}" attempt=1 max=3 rc http
            while :; do
              rm -f "$BODY_FILE"
              echo "Percobaan $attempt/$max: GET $url ($(date -u +%H:%M:%S) UTC)"
              set +e
              http=$(curl -sS -o "$BODY_FILE" -w '%{http_code}' \
                --connect-timeout 20 --max-time 120 \
                -H "Authorization: Bearer ${CRON_SECRET}" "$url")
              rc=$?
              set -e
              if [ -s "$BODY_FILE" ]; then
                echo "HTTP $http — $(head -c 3000 "$BODY_FILE")"
              fi

              if [ "$rc" -ne 0 ]; then
                echo "::warning::curl gagal (exit $rc)"
              elif [ "$http" -ge 200 ] && [ "$http" -lt 300 ]; then
                return 0
              elif [ "$http" -ne 429 ] && [ "$http" -lt 500 ]; then
                echo "::$level::HTTP $http — tidak di-retry, ini kesalahan pemanggil/konfigurasi."
                return 1
              else
                echo "::warning::HTTP $http"
              fi

              if [ "$attempt" -ge "$max" ]; then
                echo "::$level::Gagal setelah $max percobaan."
                return 1
              fi
              sleep $((attempt * 15))
              attempt=$((attempt + 1))

              # Retry scan cukup melanjutkan kode yang belum tersimpan.
              case "$url" in
                */api/scan\?*resume=1*) ;;
                */api/scan\?*) url="${url}&resume=1" ;;
              esac
            done
          }

          # ------------------------------------------------------------
          # Preflight makro (khusus scan)
          # ------------------------------------------------------------
          # Jalankan macro-scan HANYA kalau snapshot hari ini belum ada.
          # Kegagalannya cuma warning: scan tanpa makro segar tetap jauh
          # lebih baik daripada tidak ada scan sama sekali, karena scan
          # tidak bisa diulang untuk tanggal yang sudah lewat.
          if [[ "$ENDPOINT" == /api/scan* ]]; then
            TODAY_WIB=$(TZ=Asia/Jakarta date +%F)
            macro_date=$(curl -sS --max-time 20 "${BASE_URL}/api/macro-latest" 2>/dev/null \
              | jq -r '.snapshot_date // empty' 2>/dev/null || true)
            if [ "$macro_date" = "$TODAY_WIB" ]; then
              echo "Snapshot makro $TODAY_WIB sudah ada."
            else
              echo "Snapshot makro terakhir: ${macro_date:-tidak ada}. Menjalankan macro-scan dulu."
              if ! request "${BASE_URL}/api/macro-scan" warning; then
                echo "::warning::macro-scan gagal — scan tetap dijalankan dengan snapshot makro terakhir."
              fi
            fi
          fi

          # ------------------------------------------------------------
          # Panggilan utama
          # ------------------------------------------------------------
          request "${BASE_URL}${ENDPOINT}" || exit 1

          if ! jq empty "$BODY_FILE" 2>/dev/null; then
            echo "::error::Respons bukan JSON yang valid."
            exit 1
          fi

          # Catatan: JANGAN pakai '.success // true' — di jq operator //
          # memperlakukan false sama dengan null, jadi false ikut diganti.
          if jq -e '.success == false' "$BODY_FILE" >/dev/null; then
            echo "::error::Respons 2xx tapi success:false."
            exit 1
          fi

          case "$ENDPOINT" in
            /api/scan*)
              if jq -e '.skipped == true' "$BODY_FILE" >/dev/null; then
                echo "Bukan hari bursa, scan dilewati."
                exit 0
              fi
              status=$(jq -r '.persistence.status // "MISSING"' "$BODY_FILE")
              summary=$(jq -r '.persistence | "\(.savedTotal // 0)/\(.universeTotal // 0) tersimpan (run ini \(.savedThisRun // 0), gagal fetch \(.fetchFailed // 0), terpotong waktu \(.budgetSkipped // 0))"' "$BODY_FILE")
              if [ "$status" != "SAVED" ]; then
                # MISSING ber